<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Solicitações de Compra</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; }
        nav { background: #343a40; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-size: 14px; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 900px; margin: 30px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h2 { color: #333; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #dee2e6; text-align: left; font-size: 14px; }
        th { background-color: #f8f9fa; color: #495057; }
        .btn { background: #007bff; color: white; padding: 8px 15px; border: none; border-radius: 4px; text-decoration: none; cursor: pointer; display: inline-block; }
        .btn:hover { background: #0056b3; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #495057; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; }
        .alert { padding: 10px; background: #d4edda; color: #155724; border-radius: 4px; margin-bottom: 15px; }
        .error-alert { padding: 10px; background: #f8d7da; color: #721c24; border-radius: 4px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <nav>
        <div><strong>TOTVS RM - Gestão de Compras</strong></div>
        <div>
            <a href="{{ url_for('listar_solicitacoes') }}">Consultar Solicitações</a>
            <a href="{{ url_for('nova_solicitacao') }}">Nova Solicitação</a>
            <a href="{{ url_for('logout') }}" style="color: #ff6b6b;">Sair</a>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
